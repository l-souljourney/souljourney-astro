name: Quality Gate

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与 EdgeOne Makers 侧构建命令保持一致：check / test / build / publish-health
      # 门禁定义只有 package.json 一处，改阈值或加步骤都改那里。
      - name: Quality gate
        run: pnpm verify:baseline
